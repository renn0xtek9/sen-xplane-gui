version: "3"

vars:
  BUILD_DIR: build
  RELEASE_BUILD_DIR: "{{.BUILD_DIR}}/release"
  DEBUG_BUILD_DIR: "{{.BUILD_DIR}}/debug"

tasks:
  formatting:
    desc: Run all repository formatting and validation hooks
    cmds:
      - pre-commit run --all-files

  build-third-party:
    desc: Build the bundled X-Plane node
    dir: third_party/x_plane_node
    cmds:
      - cmake -S . -B build
      - cmake --build build

  build-release:
    desc: Configure and build the release preset, then run tests
    cmds:
      - cmake --preset release
      - cmake --build {{.RELEASE_BUILD_DIR}}
      - cmake --build {{.RELEASE_BUILD_DIR}} --target test

  build-debug:
    desc: Configure and build the debug preset, then run tests
    cmds:
      - cmake --preset debug
      - cmake --build {{.BUILD_DIR}}/debug
      - cmake --build {{.BUILD_DIR}}/debug --target test

  clang-tidy:
    desc: Run clang-tidy against the release build
    cmds:
      - run-clang-tidy -p {{.RELEASE_BUILD_DIR}} '^(?!.*(?:mocs_compilation\.cpp$|_qmltyperegistrations\.cpp$|/\.qt/rcc/|/\.rcc/))' -j 4

  code-coverage:
    desc: Build debug, run code-quality checks, and open the coverage report
    cmds:
      - cmake --preset debug
      - cmake --build {{.DEBUG_BUILD_DIR}}
      - cmake --build {{.DEBUG_BUILD_DIR}} --target code-coverage
      - cmd: ctest --test-dir {{.DEBUG_BUILD_DIR}} -R '^code-quality$' --output-on-failure
        ignore_error: true
      - cmd: echo "Coverage report {{.DEBUG_BUILD_DIR}}/coverage-report/index.html"
