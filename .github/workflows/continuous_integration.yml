name: Continuous integration

on:
  pull_request:
    branches: master

permissions:
  contents: read
  pull-requests: read

jobs:
  update-environments:
    name: "Update environments"
    uses: ./.github/workflows/devcontainer.yml

  release-build-pipeline:
    name: "Release build pipeline"
    runs-on: self-hosted
    needs:
      - update-environments
    if: ${{ always() && (needs.update-environments.result == 'success' || needs.update-environments.result == 'skipped') }}
    container:
      image: 192.168.178.39:5443/sen-xplane-gui:0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: _work_system/
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Formatting
        working-directory: /home/github-runner/sen-xplane-gui/_work/sen-xplane-gui/sen-xplane-gui/_work_system
        run: task formatting
      - name: Build third party
        working-directory: /home/github-runner/sen-xplane-gui/_work/sen-xplane-gui/sen-xplane-gui/_work_system
        run: task build-third-party
      - name: Build project
        working-directory: /home/github-runner/sen-xplane-gui/_work/sen-xplane-gui/sen-xplane-gui/_work_system
        run: task build-release
      - name: Run clang-tidy check
        working-directory: /home/github-runner/sen-xplane-gui/_work/sen-xplane-gui/sen-xplane-gui/_work_system
        run: task clang-tidy

  debug-build-pipeline:
    name: "Debug build pipeline"
    runs-on: self-hosted
    needs:
      - update-environments
    if: ${{ always() && (needs.update-environments.result == 'success' || needs.update-environments.result == 'skipped') }}
    container:
      image: 192.168.178.39:5443/sen-xplane-gui:0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: _work_system/
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build third party
        working-directory: /home/github-runner/sen-xplane-gui/_work/sen-xplane-gui/sen-xplane-gui/_work_system
        run: task build-third-party
      - name: Build project
        working-directory: /home/github-runner/sen-xplane-gui/_work/sen-xplane-gui/sen-xplane-gui/_work_system
        run: task build-debug
