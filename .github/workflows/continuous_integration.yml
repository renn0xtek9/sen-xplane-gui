name: Continuous integration

on:
  pull_request:
    branches: master

permissions:
  contents: read
  pull-requests: read

jobs:
  update-environments:
    name: "Update environments"
    uses: ./.github/workflows/devcontainer.yml

  formatting:
    name: "Formatting"
    runs-on: self-hosted
    needs:
      - update-environments
    if: ${{ always() && (needs.update-environments.result == 'success' || needs.update-environments.result == 'skipped') }}
    container:
      image: 192.168.178.39:5443/sen-xplane-gui:0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: _work_system/
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run pre-commit
        working-directory: /home/github-runner/sen-xplane-gui/_work/sen-xplane-gui/sen-xplane-gui/_work_system
        run: pre-commit run --all-files
      # - name: Restore runner ownership
      #   if: always()
      #   run: |
      #     runner_owner="$(stat -c '%u:%g' "$RUNNER_TEMP")"
      #     chown -R "$runner_owner" "$GITHUB_WORKSPACE"
