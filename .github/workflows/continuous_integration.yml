name: Continuous integration

on:
  pull_request:
    branches: master

permissions:
  contents: read
  pull-requests: read

jobs:
  update-environments:
    name: "Update environments"
    uses: ./.github/workflows/devcontainer.yml

  build-pipeline:
    name: "Build pipeline"
    runs-on: self-hosted
    needs:
      - update-environments
    if: ${{ always() && (needs.update-environments.result == 'success' || needs.update-environments.result == 'skipped') }}
    container:
      image: 192.168.178.39:5443/sen-xplane-gui:0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: _work_system/
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Formatting
        working-directory: /home/github-runner/sen-xplane-gui/_work/sen-xplane-gui/sen-xplane-gui/_work_system
        run: pre-commit run --all-files
      - name: Build third party
        working-directory: /home/github-runner/sen-xplane-gui/_work/sen-xplane-gui/sen-xplane-gui/_work_system
        run: cd third_party/x_plane_node/ && cmake -S . -B build && cmake --build build
      - name: Build project
        working-directory: /home/github-runner/sen-xplane-gui/_work/sen-xplane-gui/sen-xplane-gui/_work_system
        run: |
          cmake --preset release 
          cmake --build build/release 
          cmake --build build/release/ --target test
